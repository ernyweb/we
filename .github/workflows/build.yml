name: Build Android & iOS

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26b
        
    - name: Install CMake
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build
        
    - name: Create Android project structure
      run: |
        mkdir -p android/app/src/main/jni
        mkdir -p android/app/src/main/java/com/runner3d/app
        cp -r src android/app/src/main/jni/
        cp CMakeLists.txt android/app/src/main/jni/
        
    - name: Create Android build files
      run: |
        cat > android/app/src/main/AndroidManifest.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.runner3d.app">
            
            <uses-feature android:glEsVersion="0x00030000" android:required="true" />
            <uses-permission android:name="android.permission.VIBRATE" />
            
            <application
                android:label="Runner3D"
                android:hasCode="false">
                <activity
                    android:name="android.app.NativeActivity"
                    android:exported="true"
                    android:theme="@android:style/Theme.NoTitleBar.Fullscreen"
                    android:configChanges="orientation|keyboardHidden|screenSize"
                    android:screenOrientation="portrait">
                    <meta-data
                        android:name="android.app.lib_name"
                        android:value="Runner3D" />
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        cat > android/app/build.gradle << 'EOF'
        plugins {
            id 'com.android.application'
        }
        
        android {
            namespace 'com.runner3d.app'
            compileSdk 34
            ndkVersion "26.1.10909125"
            
            defaultConfig {
                applicationId "com.runner3d.app"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
                
                externalNativeBuild {
                    cmake {
                        cppFlags "-std=c++17 -frtti -fexceptions"
                        arguments "-DANDROID_STL=c++_shared",
                                  "-DANDROID_PLATFORM=android-24"
                    }
                }
                
                ndk {
                    abiFilters 'arm64-v8a', 'armeabi-v7a'
                }
            }
            
            buildTypes {
                release {
                    minifyEnabled false
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
                }
            }
            
            externalNativeBuild {
                cmake {
                    path "src/main/jni/CMakeLists.txt"
                    version "3.22.1"
                }
            }
            
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        EOF
        
        cat > android/build.gradle << 'EOF'
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.0'
            }
        }
        
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF
        
        cat > android/settings.gradle << 'EOF'
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        
        rootProject.name = "Runner3D"
        include ':app'
        EOF
        
        cat > android/gradle.properties << 'EOF'
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m
        android.nonTransitiveRClass=true
        EOF
        
    - name: Generate Gradle Wrapper
      run: |
        cd android
        gradle wrapper --gradle-version 8.5
        
    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease --stacktrace
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: runner3d-android
        path: android/app/build/outputs/apk/release/*.apk
        retention-days: 30

  build-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        brew install cmake ninja
        
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Build for iOS
      run: |
        mkdir -p build-ios
        cd build-ios
        cmake .. -GXcode \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM="${{ secrets.IOS_TEAM_ID }}" \
          -DIOS=ON
        cmake --build . --config Release
        
    - name: Create IPA
      run: |
        cd build-ios/Release-iphoneos
        mkdir -p Payload
        cp -r Runner3D.app Payload/
        zip -r Runner3D.ipa Payload
        
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: runner3d-ios
        path: build-ios/Release-iphoneos/*.ipa
        retention-days: 30

  create-release:
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Download Android APK
      uses: actions/download-artifact@v4
      with:
        name: runner3d-android
        path: ./artifacts/android
        
    - name: Download iOS IPA
      uses: actions/download-artifact@v4
      with:
        name: runner3d-ios
        path: ./artifacts/ios
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Runner3D Mobile v1.0.${{ github.run_number }}
        body: |
          🎮 **Runner3D Mobile - Automated Build**
          
          **Platform:** Android (arm64-v8a, armeabi-v7a) & iOS (arm64)
          **Build:** #${{ github.run_number }}
          **Commit:** ${{ github.sha }}
          
          ### Installation
          - **Android:** Download APK and install
          - **iOS:** Requires TestFlight or enterprise signing
          
          ### Features
          - ✅ 100% Offline gameplay
          - ✅ 10 characters
          - ✅ 3-lane endless runner
          - ✅ Touch controls
          - ✅ Day/night cycle
          - ✅ Local save system
        files: |
          artifacts/android/*.apk
          artifacts/ios/*.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
