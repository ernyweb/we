<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>Runner3D</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:system-ui,sans-serif; overflow:hidden; background:#000; color:#fff; }
    #gameContainer { position:absolute; top:0; left:0; width:100%; height:100%; }
    #ui { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:10; }
    #score { position:absolute; top:20px; left:20px; font-size:24px; font-weight:bold; text-shadow:2px 2px 4px #000; }
    #menu { position:absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(0,0,0,0.8); pointer-events:auto; }
    #menu h1 { font-size:48px; margin-bottom:20px; color:#ff6f61; }
    #playBtn { padding:15px 40px; font-size:24px; background:#ff6f61; color:#fff; border:none; border-radius:8px; cursor:pointer; margin:20px; }
    #playBtn:active { background:#ff5040; }
    #best { margin-top:20px; font-size:18px; }
  </style>
</head>
<body>
  <div id="gameContainer"></div>
  <div id="ui">
    <div id="score">Score: 0</div>
    <div id="menu">
      <h1>🏃 Runner vs Zombies</h1>
      <p id="best">Best: 0</p>
      <button id="playBtn">PLAY</button>
      <p style="font-size:14px; opacity:0.7; margin-top:20px;">
        Sola/sağa dokun → şerit değiştir • Yukarı/boşluk → zıpla • Zombilere çarpma!
      </p>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="game_simple.js"></script>
</body>
</html>
